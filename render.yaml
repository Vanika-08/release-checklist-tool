# Render Blueprint for the API. Database: Neon (or Render Postgres); paste its URL as DATABASE_URL.
services:
  - type: web
    name: release-checklist-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false   # e.g. https://release-checklist-tool.vercel.app
      - key: DB_POOL_MAX
        value: "5"
